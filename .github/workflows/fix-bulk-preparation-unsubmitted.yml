name: One-time bulk preparation fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-bulk-preparation-unsubmitted.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch bulk preparation traversal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          content_path = Path("extension/content.js")
          test_path = Path("tests/bulk-preparation-flow.mjs")
          content = content_path.read_text(encoding="utf-8")
          tests = test_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          content = replace_once(
              content,
              '    const before = getStudentKey();',
              '    const before = navigationStudentKey();',
              'navigation key before student move',
          )

          content = replace_once(
              content,
              '      if (status === "missing" && findSubmissionButton(direction === "next" ? "previous" : "next")) return "end";\n',
              '      // 未提出者への切替直後は「次へ」だけが一時的に消え、前へだけ残ることがある。\n'
              '      // その状態を末尾とみなさず、ボタンの再描画を待つ。\n',
              'remove false end detection',
          )

          content = replace_once(
              content,
              '      transition = result.transition || null;\n'
              '      retries += 1;\n'
              '      const stalled = retries > BACKGROUND_RETRY_BEFORE_STALLED;',
              '      transition = result.transition || null;\n'
              '      retries += 1;\n'
              '      if (retries > BACKGROUND_RETRY_BEFORE_STALLED + 3) return "stuck";\n'
              '      const stalled = retries > BACKGROUND_RETRY_BEFORE_STALLED;',
              'bound missing-button retries',
          )

          content = replace_once(
              content,
              '    let noAttachmentCount = 0;\n'
              '    let forwardMoves = 0;\n'
              '    const failedNames = [];',
              '    let noAttachmentCount = 0;\n'
              '    let forwardMoves = 0;\n'
              '    let stopReason = "";\n'
              '    const failedNames = [];',
              'add traversal stop reason',
          )

          content = replace_once(
              content,
              '        // 提出物の名前が出そろってから鍵を作る。先に作ると読み込み途中の\n'
              '        // 名前で保存され、採点時に準備済みPDFを見つけられなくなる。\n'
              '        let fileInfo = sequence === 1 && initialFileInfo\n'
              '          ? initialFileInfo\n'
              '          : await waitForSubmissionFileWithRecovery(15000);\n'
              '        const studentKey = getStudentKey();\n'
              '        if (!studentKey || seen.has(studentKey)) break;\n'
              '        seen.add(studentKey);',
              '        // 未提出者では添付欄や前後ボタンが一時的に消えるため、画面要素ではなく\n'
              '        // URLの学生IDを優先して現在の学生を識別する。\n'
              '        const studentKey = navigationStudentKey();\n'
              '        if (!studentKey) {\n'
              '          stopReason = "student-key-missing";\n'
              '          break;\n'
              '        }\n'
              '        if (seen.has(studentKey)) {\n'
              '          stopReason = "duplicate-student";\n'
              '          break;\n'
              '        }\n'
              '        seen.add(studentKey);\n'
              '        const currentStatus = zipStatusOf(getStudentLabel());\n'
              '        const knownUnsubmitted = currentStatus === "未提出";\n'
              '        let fileInfo = knownUnsubmitted\n'
              '          ? { noAttachment: true }\n'
              '          : sequence === 1 && initialFileInfo\n'
              '            ? initialFileInfo\n'
              '            : await waitForSubmissionFileWithRecovery(15000);',
              'identify and skip unsubmitted students safely',
          )

          ledger_key = '                studentKey: getStudentKey(),'
          ledger_count = content.count(ledger_key)
          if ledger_count != 2:
              raise SystemExit(f"ledger student keys: expected 2 matches, found {ledger_count}")
          content = content.replace(ledger_key, '                studentKey,')

          content = replace_once(
              content,
              '        const moved = await moveWithRecovery("next");\n'
              '        if (moved === "stuck") {\n'
              '          break;\n'
              '        }\n'
              '        if (moved === "end") break;\n'
              '        forwardMoves += 1;\n'
              '        if (limit > 0 && seen.size >= limit) break;\n'
              '      }\n\n'
              '      if (!dedicated) {',
              '        const moved = await moveWithRecovery("next");\n'
              '        if (moved === "stuck") {\n'
              '          stopReason = "stuck";\n'
              '          break;\n'
              '        }\n'
              '        if (moved === "end") {\n'
              '          stopReason = "end";\n'
              '          break;\n'
              '        }\n'
              '        forwardMoves += 1;\n'
              '        if (limit > 0 && seen.size >= limit) {\n'
              '          stopReason = "limit";\n'
              '          break;\n'
              '        }\n'
              '      }\n\n'
              '      if (!state.prepareCancelled && !["end", "limit"].includes(stopReason)) {\n'
              '        const reason = {\n'
              '          "student-key-missing": "現在の学生を識別できませんでした",\n'
              '          "duplicate-student": "同じ学生を再び検出しました",\n'
              '          stuck: "次の学生への切替を確認できませんでした"\n'
              '        }[stopReason] || "一括準備を最後まで完了できませんでした";\n'
              '        throw new Error(`${reason}。${seen.size}人目まで確認しました。現在表示している学生から再開してください。`);\n'
              '      }\n\n'
              '      if (!dedicated) {',
              'distinguish completion from interruption',
          )

          old_console = 'console.log("4件の一括準備・キャッシュ・先読み・排他テストに合格しました。");'
          new_tests = '''// テスト5：未提出者を挟んでも巡回を続け、途中停止を完了扱いしない
          assert.match(content, /const before = navigationStudentKey\(\);/);
          assert.match(content, /const studentKey = navigationStudentKey\(\);/);
          assert.match(content, /const knownUnsubmitted = currentStatus === "未提出";/);
          assert.match(content, /knownUnsubmitted\s*\?\s*\{ noAttachment: true \}/);
          assert.doesNotMatch(content, /status === "missing" && findSubmissionButton/);
          assert.match(content, /stopReason = "student-key-missing"/);
          assert.match(content, /stopReason = "duplicate-student"/);
          assert.match(content, /stopReason = "stuck"/);
          assert.match(content, /!\["end", "limit"\]\.includes\(stopReason\)/);

          console.log("5件の一括準備・キャッシュ・先読み・排他・未提出者継続テストに合格しました。");'''
          tests = replace_once(tests, old_console, new_tests, 'extend bulk preparation tests')

          content_path.write_text(content, encoding="utf-8")
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Verify syntax and tests
        shell: bash
        run: |
          node --check extension/content.js
          node tests/bulk-preparation-flow.mjs
          node tests/validate-release.mjs

      - name: Commit verified fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/fix-bulk-preparation-unsubmitted.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "[bulk-preparation-fix] Fix traversal across unsubmitted students"
          git push origin HEAD:main
