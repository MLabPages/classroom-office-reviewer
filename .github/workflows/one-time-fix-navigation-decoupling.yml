name: One-time fix navigation decoupling

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch-and-verify:
    if: github.event.issue.title == '[crw-maintenance] decouple navigation from file loading'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch navigation and PDF handling
        shell: bash
        run: |
          set -o pipefail
          {
            python3 tools/one_time_fix_navigation_decoupling.py
            python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/bulk-preparation-flow.mjs")
          text = path.read_text(encoding="utf-8")
          start = text.index("// テスト9：未提出ステータスだけの画面でも切替完了にし、クリック後の遷移を再確認する。")
          end = text.index("// テスト10：学生移動はURLの学生IDだけで判定し、ファイル表示とは分離する。", start)
          replacement = '''// テスト9：未提出ステータスは、次の学生のファイル待機を省略する判断に使う。
          assert.match(content, /"割り当て済み", "不足", "未提出"/);
          assert.match(content, /\["割り当て済み", "不足", "Assigned", "Missing", "未提出"\]/);
          assert.match(content, /const missingStudent = zipStatusOf\(getStudentLabel\(\)\) === "未提出";/);

          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
          } 2>&1 | tee /tmp/crw-navigation-fix.log

      - name: Verify syntax and tests
        shell: bash
        run: |
          set -o pipefail
          {
            node --check extension/content.js
            node tests/content-detection.mjs
            node tests/bulk-preparation-flow.mjs
            node tests/validate-release.mjs
          } 2>&1 | tee -a /tmp/crw-navigation-fix.log

      - name: Commit verified fix
        shell: bash
        run: |
          rm tools/one_time_fix_navigation_decoupling.py
          rm .github/workflows/one-time-fix-navigation-decoupling.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Decouple student navigation from file loading"
          git push origin HEAD:main
          echo "FIX_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "学生移動とファイル読み込みの分離、背面継続、PDF直登録の修正とテストが完了し、mainへ反映しました。Commit: $FIX_COMMIT"
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          LOG=$(tail -c 8000 /tmp/crw-navigation-fix.log 2>/dev/null || echo "ログを取得できませんでした。")
          BODY=$(printf '自動修正またはテストに失敗したため、コード本体はmainへ反映していません。\n\n```text\n%s\n```' "$LOG")
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$BODY"
