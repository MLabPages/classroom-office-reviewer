name: One-time fix stale attachment leak

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch-and-verify:
    if: github.event.issue.title == '[crw-maintenance] stop stale attachment leak'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch attachment discovery
        shell: bash
        run: |
          set -o pipefail
          {
            python3 tools/one_time_fix_stale_attachment_leak.py
            python3 - <<'PY'
          from pathlib import Path

          path = Path("extension/content.js")
          text = path.read_text(encoding="utf-8")
          old = '''    const visibleHints = visibleSubmissionAttachmentHints();
          if (visibleHints.length) {
            const matchedVisibleItems = items.filter((node) => {
              const attachment = attachmentInfoOf(node);
              return attachment && visibleHints.some((hint) => sameFile(hint, attachment));
            });
            if (matchedVisibleItems.length) return matchedVisibleItems;
          }

          // 画面には別の提出者のメニューが残っていることがある。表示中のファイルが
          '''
          new = '''    const menuGroupCount = new Set(items.map((node) => node.closest?.("[role='menu']") || null)).size;
          const visibleHints = visibleSubmissionAttachmentHints();
          if (visibleHints.length) {
            const matchedVisibleItems = items.filter((node) => {
              const attachment = attachmentInfoOf(node);
              return attachment && visibleHints.some((hint) => sameFile(hint, attachment));
            });
            // 同じmenu内へ履歴が混在している場合は現在見えているカードで絞る。
            // 別menuとして分離できている場合は、後段のグループ判定で非表示の
            // 2件目以降も保持する。
            if (matchedVisibleItems.length && menuGroupCount < 2) return matchedVisibleItems;
          }

          // 画面には別の提出者のメニューが残っていることがある。表示中のファイルが
          '''
          if text.count(old) != 1:
              raise SystemExit(f"menu refinement: expected 1 match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          } 2>&1 | tee /tmp/crw-stale-attachment-fix.log

      - name: Verify syntax and tests
        shell: bash
        run: |
          set -o pipefail
          {
            node --check extension/content.js
            node tests/content-detection.mjs
            node tests/bulk-preparation-flow.mjs
            node tests/validate-release.mjs
          } 2>&1 | tee -a /tmp/crw-stale-attachment-fix.log

      - name: Commit verified fix
        shell: bash
        run: |
          rm tools/one_time_fix_stale_attachment_leak.py
          rm .github/workflows/one-time-fix-stale-attachment-leak.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prevent cross-student attachment leakage"
          git push origin HEAD:main
          echo "FIX_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "過去学生の添付DOMが現在学生へ混入する問題を修正し、mainへ反映しました。Commit: $FIX_COMMIT"
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          LOG=$(tail -c 8000 /tmp/crw-stale-attachment-fix.log 2>/dev/null || echo "ログを取得できませんでした。")
          BODY=$(printf '自動修正またはテストに失敗したため、コード本体はmainへ反映していません。\n\n```text\n%s\n```' "$LOG")
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$BODY"
