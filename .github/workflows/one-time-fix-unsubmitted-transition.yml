name: One-time fix unsubmitted transition

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch-and-verify:
    if: github.event.issue.title == '[crw-maintenance] fix unsubmitted transition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch transition detection
        run: python3 tools/one_time_fix_unsubmitted_transition.py

      - name: Verify syntax and tests
        run: |
          node --check extension/content.js
          node tests/bulk-preparation-flow.mjs
          node tests/validate-release.mjs

      - name: Commit verified fix
        run: |
          rm tools/one_time_fix_unsubmitted_transition.py
          rm .github/workflows/one-time-fix-unsubmitted-transition.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix unsubmitted student transition detection"
          git push origin HEAD:main
          echo "FIX_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "修正・構文確認・既存テストが完了し、mainへ反映しました。Commit: $FIX_COMMIT"
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "自動修正またはテストに失敗したため、コード本体はmainへ反映していません。Actionsログを確認してください。"
