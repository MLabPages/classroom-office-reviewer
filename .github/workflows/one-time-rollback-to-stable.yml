name: One-time rollback to stable CRW

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  rollback-and-verify:
    if: github.event.issue.title == '[crw-maintenance] rollback to 1e5552f'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore stable implementation
        shell: bash
        run: |
          git checkout 1e5552f728037ff001ac7fcabda7611fd5d128d1 -- \
            extension/content.js \
            tests/bulk-preparation-flow.mjs \
            tests/content-detection.mjs \
            tests/validate-release.mjs

      - name: Verify restored code
        shell: bash
        run: |
          node --check extension/content.js
          node tests/content-detection.mjs
          node tests/bulk-preparation-flow.mjs
          node tests/validate-release.mjs

      - name: Commit rollback
        shell: bash
        run: |
          rm .github/workflows/one-time-rollback-to-stable.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Rollback unstable bulk preparation changes"
          git push origin HEAD:main
          echo "ROLLBACK_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "安定版 1e5552f の4ファイルへ復元し、構文確認と既存テストを通してmainへ反映しました。Commit: $ROLLBACK_COMMIT"
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "ロールバックまたはテストに失敗したため、復旧コミットはmainへ反映していません。"
